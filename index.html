<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Website Icon / Logo -->

  <!-- Mobile Responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO Meta Title -->
  <title>
    Zain Careers | Educational Platform for Career Growth & Learning
  </title>

  <!-- SEO Meta Description -->
  <meta name="description"

  <!-- SEO Keywords -->
  <meta name="keywords"
    content="Zain Careers, education platform, online learning, career guidance, courses, mentorship, student platform, skill development, career growth" />

  <!-- Author -->

  <!-- Theme Color -->
  <meta name="theme-color" content="#0f172a" />

  <!-- Open Graph / Social Media -->
  <meta property="og:title" content="Zain Careers | Educational Platform" />

    content="Empowering students and professionals through learning, mentorship, and career opportunities." />

  <meta name="twitter:card" content="summary_large_image" />

  <meta name="twitter:description"
    content="Empowering students and professionals through learning and career growth." />
  <meta name="twitter:image" content="/assets/logo.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
